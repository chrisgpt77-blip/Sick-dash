name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.1 (creates tag v1.0.1)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then tag="v${INPUT_VERSION#v}"; else tag="$GITHUB_REF_NAME"; fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          name="${tag#v}"
          IFS=. read -r major minor patch <<< "${name%%-*}"
          echo "SICKDASH_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "SICKDASH_VERSION_CODE=$(( ${major:-0} * 10000 + ${minor:-0} * 100 + ${patch:-0} ))" >> "$GITHUB_ENV"

      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SICKDASH_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SICKDASH_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SICKDASH_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SICKDASH_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Tolerate line breaks / spaces picked up when pasting the secret.
            clean=$(printf '%s' "$KEYSTORE_BASE64" | tr -d ' \t\r\n')
            echo "Keystore secret: ${#clean} base64 characters after removing whitespace (expected 5712)."
            if ! printf '%s' "$clean" | base64 -d > "$RUNNER_TEMP/release.jks" 2>/dev/null; then
              bad=$(printf '%s' "$clean" | tr -d 'A-Za-z0-9+/=' | head -c 20 | od -An -c | tr -s ' ')
              echo "::error::SICKDASH_KEYSTORE_BASE64 is not valid base64 (unexpected characters:${bad:- none}; length ${#clean}). Re-paste it as one line."
              exit 1
            fi
            if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
              echo "::error::Keystore decoded (sha256 $(sha256sum "$RUNNER_TEMP/release.jks" | cut -c1-12)…, expected 90ebb818daa8…) but the password or alias doesn't open it. Check SICKDASH_KEYSTORE_PASSWORD and SICKDASH_KEY_ALIAS."
              exit 1
            fi
            {
              echo "SICKDASH_KEYSTORE=$RUNNER_TEMP/release.jks"
              echo "SICKDASH_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "SICKDASH_KEY_ALIAS=$KEY_ALIAS"
              echo "SICKDASH_KEY_PASSWORD=$KEY_PASSWORD"
              echo "SIGNED_WITH=release key"
            } >> "$GITHUB_ENV"
          else
            echo "::error::Add the SICKDASH_KEYSTORE_BASE64 / _PASSWORD / KEY_ALIAS / KEY_PASSWORD repository secrets first (see README → Releases)."
            exit 1
          fi

      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="SickDash-${SICKDASH_VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          cat > notes.md <<NOTES
          Sick Dash ${SICKDASH_VERSION_NAME}: GR86 / BRZ HUD for Android Auto.

          **Install:** download \`$apk\` below, open it on your phone (allow installs from your browser/files app).
          Then in Android Auto: Settings → tap *Version* ~10 times → ⋮ → Developer settings → enable **Unknown sources**.

          Signed with: ${SIGNED_WITH}
          SHA-256: \`$sha\`
          NOTES
          gh release create "$RELEASE_TAG" "$apk" --target "$GITHUB_SHA" --title "Sick Dash ${SICKDASH_VERSION_NAME}" --notes-file notes.md
